{% set name = "album-gui" %}
{% set version = "0.5.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1bc667d07eab2d347946c42a6186da6c5d03340b60afc53be147e088351465aa

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - album >=1.0.0,<2.0.0
    - pyqt >=5.15.6
    - pywin32-on-windows >=0.1.0

test:
  imports:
    - album.gui
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://album.solutions
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Album is a framework for unifying computational tools across frameworks, languages, and environments. This package provides a graphical user interface for Album.
  doc_url: https://docs.album.solutions
  dev_url: https://gitlab.com/album-app/plugins/album-gui

extra:
  recipe-maintainers:
    - jpalbrecht
    - frauzufall
